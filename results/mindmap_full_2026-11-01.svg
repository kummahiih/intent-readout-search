<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1200" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="1900" height="1200" fill="#fafafa"/>
  <rect x="790" y="540" width="320" height="64" rx="8" fill="#1a1a1a"/>
  <text x="950" y="568" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">Intent readout search</text>
  <text x="950" y="588" text-anchor="middle" fill="#aaa" font-size="11">cameraPass no · handoverPass no · Phase 2 open</text>

  <text x="200" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#333">Early sensors · Sep 2026</text>
  <text x="560" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#333">Camera gates</text>
  <text x="1040" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#333">Scale and MASK</text>
  <text x="1500" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#333">Phase 1–2 · Oct</text>
  <text x="1750" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#333">Layout · Nov</text>

  <g font-size="11">
    <rect x="40" y="60" width="320" height="70" rx="5" fill="#fff" stroke="#ddd"/>
    <text x="200" y="80" text-anchor="middle" font-weight="600">Forced button</text>
    <text x="200" y="96" text-anchor="middle" fill="#555">Qwen tag LOTO 0.003 · Mistral kind 0.776</text>
    <text x="200" y="112" text-anchor="middle" fill="#999">Kind LOTO was YES/NO geometry</text>

    <rect x="40" y="145" width="320" height="70" rx="5" fill="#fff" stroke="#ddd"/>
    <text x="200" y="165" text-anchor="middle" font-weight="600">Multi-r / construct</text>
    <text x="200" y="181" text-anchor="middle" fill="#555">Ensemble LOTO 0.05 weaker than plain</text>
    <text x="200" y="197" text-anchor="middle" fill="#999">Hiking thin on every probe</text>

    <rect x="40" y="230" width="320" height="70" rx="5" fill="#fff" stroke="#ddd"/>
    <text x="200" y="250" text-anchor="middle" font-weight="600">Cross-judge</text>
    <text x="200" y="266" text-anchor="middle" fill="#555">Qwen→Mistral 0.098 · reverse 0.198</text>
    <text x="200" y="282" text-anchor="middle" fill="#999">Same rooms loud. Not portable</text>

    <rect x="40" y="315" width="320" height="70" rx="5" fill="#fff" stroke="#ddd"/>
    <text x="200" y="335" text-anchor="middle" font-weight="600">Topic residual / overnight</text>
    <text x="200" y="351" text-anchor="middle" fill="#555">Last layer also classified topic</text>
    <text x="200" y="367" text-anchor="middle" fill="#999">Would slap the subject</text>

    <rect x="400" y="60" width="320" height="85" rx="5" fill="#fff3e0" stroke="#ff9800"/>
    <text x="560" y="80" text-anchor="middle" font-weight="600">Plan LOTO (candidate)</text>
    <text x="560" y="96" text-anchor="middle" fill="#555">Qwen L8 0.105 · Mistral L9 0.116</text>
    <text x="560" y="112" text-anchor="middle" fill="#555">Paraphrase and prefix keep the mean</text>
    <text x="560" y="128" text-anchor="middle" fill="#999">Cosine gap, not accuracy</text>

    <rect x="400" y="160" width="320" height="85" rx="5" fill="#ffebee" stroke="#e57373"/>
    <text x="560" y="180" text-anchor="middle" font-weight="600">Hiking kills shared axis</text>
    <text x="560" y="196" text-anchor="middle" fill="#555">Shared LOTO 0.013 / 0.069</text>
    <text x="560" y="212" text-anchor="middle" fill="#555">In-room hold ~0.20 / 0.28</text>
    <text x="560" y="228" text-anchor="middle" fill="#c62828">cameraPass already no</text>

    <rect x="400" y="260" width="320" height="70" rx="5" fill="#fff" stroke="#ddd"/>
    <text x="560" y="280" text-anchor="middle" font-weight="600">Pre-button tag LOTO</text>
    <text x="560" y="296" text-anchor="middle" fill="#555">0.011 on both 7B models</text>
    <text x="560" y="312" text-anchor="middle" fill="#999">Does not own hiking</text>

    <rect x="400" y="345" width="320" height="70" rx="5" fill="#fff" stroke="#ddd"/>
    <text x="560" y="365" text-anchor="middle" font-weight="600">Pre-button patch</text>
    <text x="560" y="381" text-anchor="middle" fill="#555">Qwen fit delta −0.018</text>
    <text x="560" y="397" text-anchor="middle" fill="#999">Smaller than room swings</text>

    <rect x="880" y="60" width="320" height="70" rx="5" fill="#fff" stroke="#ddd"/>
    <text x="1040" y="80" text-anchor="middle" font-weight="600">Scale walks</text>
    <text x="1040" y="96" text-anchor="middle" fill="#555">Gemma L10 wallpaper · Falcon copies shape</text>
    <text x="1040" y="112" text-anchor="middle" fill="#999">Phi-4 skipped. Aya is a print bar</text>

    <rect x="880" y="145" width="320" height="85" rx="5" fill="#fff" stroke="#ddd"/>
    <text x="1040" y="165" text-anchor="middle" font-weight="600">MASK official (711 rows)</text>
    <text x="1040" y="181" text-anchor="middle" fill="#555">Qwen lie-given-known 0.623 (240/385)</text>
    <text x="1040" y="197" text-anchor="middle" fill="#555">Gemma 0.480 · Aya 0.539 · Mistral 0.523</text>
    <text x="1040" y="213" text-anchor="middle" fill="#999">Not paper P(Lie). Not a cover rate</text>

    <rect x="880" y="245" width="320" height="70" rx="5" fill="#fff" stroke="#ddd"/>
    <text x="1040" y="265" text-anchor="middle" font-weight="600">Pressure rows</text>
    <text x="1040" y="281" text-anchor="middle" fill="#555">Qwen 0.370–0.615 · Mistral 0.588–0.867</text>
    <text x="1040" y="297" text-anchor="middle" fill="#999">Three columns. Not pooled</text>

    <rect x="880" y="330" width="320" height="70" rx="5" fill="#fff" stroke="#ddd"/>
    <text x="1040" y="350" text-anchor="middle" font-weight="600">Note→HIDE</text>
    <text x="1040" y="366" text-anchor="middle" fill="#555">Near chance on all walks</text>
    <text x="1040" y="382" text-anchor="middle" fill="#999">Assigned note is not the print</text>

    <rect x="1340" y="60" width="280" height="70" rx="5" fill="#fff" stroke="#ddd"/>
    <text x="1480" y="80" text-anchor="middle" font-weight="600">Night press (114 rows)</text>
    <text x="1480" y="96" text-anchor="middle" fill="#555">Qwen 25/89 · Gemma 10/102</text>
    <text x="1480" y="112" text-anchor="middle" fill="#999">Granite, Qwen3.5 empty</text>

    <rect x="1340" y="145" width="280" height="70" rx="5" fill="#fff" stroke="#ddd"/>
    <text x="1480" y="165" text-anchor="middle" font-weight="600">Note-text baseline</text>
    <text x="1480" y="181" text-anchor="middle" fill="#555">Qwen 39/55 = 0.709</text>
    <text x="1480" y="197" text-anchor="middle" fill="#999">The Phase 2 bar</text>

    <rect x="1340" y="230" width="280" height="70" rx="5" fill="#e8f5e9" stroke="#4caf50"/>
    <text x="1480" y="250" text-anchor="middle" font-weight="600">Pre-button residual</text>
    <text x="1480" y="266" text-anchor="middle" fill="#555">4/5 clear the bar</text>
    <text x="1480" y="282" text-anchor="middle" fill="#2e7d32">Saw the ask</text>

    <rect x="1340" y="315" width="280" height="70" rx="5" fill="#e8f5e9" stroke="#4caf50"/>
    <text x="1480" y="335" text-anchor="middle" font-weight="600">Combine</text>
    <text x="1480" y="351" text-anchor="middle" fill="#555">4/5 clear · noise 5/5</text>
    <text x="1480" y="367" text-anchor="middle" fill="#2e7d32">Carried by the ask</text>

    <rect x="1640" y="60" width="220" height="85" rx="5" fill="#e3f2fd" stroke="#2196f3"/>
    <text x="1750" y="80" text-anchor="middle" font-weight="600">SOM layout</text>
    <text x="1750" y="96" text-anchor="middle" fill="#555">Topic purity ~1.0</text>
    <text x="1750" y="112" text-anchor="middle" fill="#555">Strategy 0.5 → 1.0</text>
    <text x="1750" y="128" text-anchor="middle" fill="#999">After topic-mean</text>

    <rect x="1640" y="160" width="220" height="70" rx="5" fill="#e3f2fd" stroke="#2196f3"/>
    <text x="1750" y="180" text-anchor="middle" font-weight="600">Ask-removal</text>
    <text x="1750" y="196" text-anchor="middle" fill="#555">Rooms survive the ask</text>
    <text x="1750" y="212" text-anchor="middle" fill="#999">Partition is in the note</text>

    <rect x="1640" y="245" width="220" height="70" rx="5" fill="#fff" stroke="#ddd"/>
    <text x="1750" y="265" text-anchor="middle" font-weight="600">Wider roles</text>
    <text x="1750" y="281" text-anchor="middle" fill="#555">Purity ~0.3 on 12×3</text>
    <text x="1750" y="297" text-anchor="middle" fill="#999">Not a stable layout</text>

    <rect x="1640" y="330" width="220" height="70" rx="5" fill="#fff" stroke="#ddd"/>
    <text x="1750" y="350" text-anchor="middle" font-weight="600">OT rooms</text>
    <text x="1750" y="366" text-anchor="middle" fill="#555">Binary at n=16</text>
    <text x="1750" y="382" text-anchor="middle" fill="#999">Keyword match is the limit</text>

    <rect x="1610" y="410" width="280" height="85" rx="5" fill="#fff" stroke="#ddd"/>
    <text x="1750" y="430" text-anchor="middle" font-weight="600">Purity law</text>
    <text x="1750" y="446" text-anchor="middle" fill="#555">Powered at alpha=1</text>
    <text x="1750" y="462" text-anchor="middle" fill="#555">Combination above ceiling</text>
    <text x="1750" y="478" text-anchor="middle" fill="#999">Gap small on Nov models</text>
  </g>

  <rect x="200" y="1080" width="1500" height="70" rx="6" fill="#fff" stroke="#ddd"/>
  <text x="950" y="1105" text-anchor="middle" font-size="12" font-weight="600">Blocked</text>
  <text x="950" y="1125" text-anchor="middle" font-size="11" fill="#666">Hinge / D / PPO blocked · Do not fill D · Do not freeze r · SOM is not a camera · OT cost not resolved</text>

  <g font-size="11">
    <rect x="40" y="960" width="1820" height="90" rx="6" fill="#fff" stroke="#ddd"/>
    <text x="950" y="982" text-anchor="middle" font-weight="600">November 2026: layout diagnostics</text>
    <text x="950" y="1000" text-anchor="middle" fill="#555">SOM: rooms are clusters. Strategy is not until the topic mean is removed. Ask-removal does not collapse the rooms.</text>
    <text x="950" y="1018" text-anchor="middle" fill="#555">OT: cost is binary at n=16. Keyword match is the bottleneck. Roles are mostly not entered.</text>
    <text x="950" y="1036" text-anchor="middle" fill="#999">Not a camera. Do not fill D. Explains why held-in-topic is larger than shared LOTO.</text>
  </g>
</svg>
